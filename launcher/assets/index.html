<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dashboard</title>
<style>
  :root { --bg:#0F172A; --graph:#1E293B; --acc:#22D3EE; --cream:#F8FAFC; --acc-rgb:34,211,238; --cream-rgb:248,250,252; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:"Roboto","Segoe UI",sans-serif; color:var(--cream); }

  /* stała scena 1920x1080 skalowana do okna */
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:var(--bg); }
  #bg { position:absolute; inset:0; background:var(--bg) center/cover no-repeat; }
  #wave { width:100%; height:100%; display:block; }
  #shade { position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(15,23,42,.8) 0%, rgba(15,23,42,.4) 38%, rgba(15,23,42,0) 70%),
      linear-gradient(0deg, rgba(15,23,42,.55) 0%, rgba(15,23,42,.25) 22%, rgba(15,23,42,0) 45%); }

  #info { position:absolute; left:112px; top:70px; }
  #clock { font-size:230px; line-height:1; font-weight:100; letter-spacing:-4px; color:var(--cream); font-variant-numeric:tabular-nums; }
  #date { margin-top:6px; font-size:44px; font-weight:300; color:var(--cream); opacity:.85; }
  #weather { margin-top:44px; display:flex; align-items:center; gap:28px; }
  #wicon { width:96px; height:96px; flex:none; }
  #wicon svg { width:96px; height:96px; display:block; }
  #temp { font-size:84px; font-weight:200; line-height:1; }
  #wdesc { font-size:34px; font-weight:300; line-height:1.25; }
  #wdesc small { display:block; font-size:28px; opacity:.6; }

  /* kafle */
  #row { position:absolute; left:0; right:0; bottom:84px; display:flex; justify-content:center; align-items:flex-end; gap:48px; }
  .tile { position:relative; width:210px; height:230px; flex:none; border-radius:40px;
    background:rgba(30,41,59,.82); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:transform .15s ease-out; outline:none; }
  .tile::after { content:""; position:absolute; inset:0; border-radius:40px; border:5px solid var(--acc); opacity:0; transition:opacity .12s; pointer-events:none; }
  .tile:focus { transform:scale(1.06); }
  .tile:focus::after { opacity:1; }
  .tile img { width:128px; height:128px; border-radius:28px; object-fit:contain; }
  .tile .ph { width:128px; height:128px; border-radius:28px; background:var(--acc); color:var(--bg); font-size:64px; font-weight:500; display:flex; align-items:center; justify-content:center; }
  .tile .name { font-size:25px; font-weight:400; max-width:190px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.all .name { white-space:normal; line-height:1.15; max-width:150px; }
  .tile.all .glyph { width:128px; height:128px; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); gap:12px; padding:14px; }
  .tile.all .glyph i { background:var(--cream); border-radius:8px; opacity:.9; }

  /* carousel: focused icon big, the rest smaller and dimmed, label only on focus */
  #row .tile { transform:scale(.74); opacity:.72; transform-origin:50% 100%; background:rgba(40,37,39,.6);
    transition:transform .22s cubic-bezier(.23,1,.32,1), opacity .22s ease-out; }
  #row .tile:focus { transform:scale(1.3); opacity:1; background:rgba(40,37,39,.9); }
  #row .tile .name { opacity:0; transition:opacity .18s ease-out; }
  #row .tile:focus .name { opacity:1; }
  @media (prefers-reduced-motion: reduce){ #row .tile { transition:none; } }

  /* lights widget (Tuya, optional) */
  #lights { position:absolute; right:112px; top:84px; width:798px; display:flex; flex-wrap:wrap; gap:24px; }
  .tile.light { width:250px; height:128px; flex-direction:row; justify-content:flex-start; gap:20px; padding:0 26px; border-radius:36px; }
  .tile.light::after { border-radius:36px; }
  .tile.light .bulb { width:58px; height:58px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(242,237,231,.1); transition:background .2s, box-shadow .2s; }
  .tile.light .bulb svg { width:34px; height:34px; fill:none; stroke:var(--cream); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.7; }
  .tile.light.on { background:rgba(var(--acc-rgb),.22); }
  .tile.light.on .bulb { background:var(--acc); box-shadow:0 0 36px rgba(var(--acc-rgb),.55); }
  .tile.light.on .bulb svg { stroke:var(--bg); opacity:1; }
  .tile.light .lt { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .tile.light .lt b { font-size:28px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.light .lt span { font-size:22px; opacity:.6; }
  .tile.lightall { width:100%; height:64px; flex-direction:row; border-radius:32px; background:rgba(40,37,39,.4); opacity:.8; }
  .tile.lightall::after { border-radius:32px; }
  .tile.lightall span { font-size:24px; font-weight:300; letter-spacing:.5px; }
  .tile.lightall:focus { transform:scale(1.02); opacity:1; }
  .tile.light.err .lt span { color:#ff8a70; opacity:1; }

  /* siatka wszystkich aplikacji */
  #apps { position:absolute; inset:0; background:rgba(15,23,42,.72); display:none; }
  #apps.on { display:block; }
  #apps h1 { position:absolute; left:112px; top:56px; font-size:56px; font-weight:200; }
  #apps h1 span { color:var(--acc); }
  #grid { position:absolute; left:0; right:0; top:150px; bottom:0; overflow:hidden; padding:30px 112px 0 112px; }
  #gridin { display:grid; grid-template-columns:repeat(7,210px); gap:32px 32px; padding-bottom:60px; }
  #gridin .tile { width:210px; height:230px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><canvas id="wave" width="960" height="540"></canvas></div><div id="shade"></div>

  <div id="info">
    <div id="clock">--:--</div>
    <div id="date">&nbsp;</div>
    <div id="weather">
      <div id="wicon"></div>
      <div id="temp">--°</div>
      <div id="wdesc"><span id="wtext">…</span><small id="wmm"></small></div>
    </div>
  </div>

  <div id="lights"></div>
  <div id="row"></div>

  <div id="apps">
    <h1><span id="alltitle"></span> <span id="cnt"></span></h1>
    <div id="grid"><div id="gridin"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var A = window.Android;
  var stage = document.getElementById("stage");

  /* ---------- config (see config.js) ---------- */
  var C = window.CONFIG || {};
  var LANG = ((C.lang && C.lang !== "auto") ? C.lang : (navigator.language || "en")).slice(0, 2) === "pl" ? "pl" : "en";
  var TXT = {
    en: { on: "on", off: "off", offline: "no connection", allOn: "Turn all on", allOff: "Turn all off", all: "All apps", loading: "…", today: "today", asOf: "as of", sun: "Sunny", clear: "Clear", mostlySun: "Mostly sunny",
          mostlyClear: "Mostly clear", partly: "Partly cloudy", overcast: "Overcast", fog: "Fog", drizzle: "Drizzle", rain: "Rain",
          snow: "Snow", showers: "Showers", snowShowers: "Snow showers", storm: "Thunderstorm", cloudy: "Cloudy" },
    pl: { on: "włączone", off: "wyłączone", offline: "brak połączenia", allOn: "Włącz wszystko", allOff: "Wyłącz wszystko", all: "Wszystkie aplikacje", loading: "…", today: "dziś", asOf: "stan z", sun: "Słonecznie", clear: "Bezchmurnie",
          mostlySun: "Przeważnie słonecznie", mostlyClear: "Przeważnie bezchmurnie", partly: "Częściowe zachmurzenie",
          overcast: "Pochmurno", fog: "Mgła", drizzle: "Mżawka", rain: "Deszcz", snow: "Śnieg", showers: "Przelotny deszcz",
          snowShowers: "Przelotny śnieg", storm: "Burza", cloudy: "Zachmurzenie" }
  }[LANG];
  var LOCALE = LANG === "pl" ? "pl-PL" : "en-GB";
  var W = C.weather || { lat: 51.51, lon: -0.13, timezone: "Europe/London", label: "London", unit: "celsius" };
  var FAV = C.apps || [];
  if (C.wallpaper) document.getElementById("bg").style.backgroundImage = "url(" + C.wallpaper + ")";
  document.getElementById("alltitle").textContent = TXT.all;
  document.getElementById("wtext").textContent = TXT.loading;

  /* ---------- skalowanie sceny ---------- */
  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + k + ")";
    stage.style.left = Math.round((window.innerWidth - 1920 * k) / 2) + "px";
    stage.style.top = Math.round((window.innerHeight - 1080 * k) / 2) + "px";
  }
  window.addEventListener("resize", fit); fit();

  /* ---------- zegar i data ---------- */
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  var lastClock = "";
  function tick() {
    var d = new Date(), t = p2(d.getHours()) + ":" + p2(d.getMinutes());
    if (t !== lastClock) {
      lastClock = t;
      document.getElementById("clock").textContent = t;
      document.getElementById("date").textContent = d.toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long" });
    }
  }
  tick(); setInterval(tick, 1000);

  /* ---------- pogoda ---------- */
  var URL_W = "https://api.open-meteo.com/v1/forecast?latitude=" + W.lat + "&longitude=" + W.lon + "&temperature_unit=" + (W.unit || "celsius") +
    "&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=" + encodeURIComponent(W.timezone || "auto");
  var KEY = "dash.weather";
  var S = 'viewBox="0 0 96 96" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
  var CLOUD = '<path d="M28 70h40a14 14 0 0 0 2-27.8A20 20 0 0 0 31 38a16 16 0 0 0-3 32z" fill="#1E293B"/>';
  var SUN = '<circle cx="48" cy="48" r="15" stroke="#22D3EE" fill="#22D3EE" fill-opacity=".25"/>' +
    '<path stroke="#22D3EE" d="M48 15v8M48 73v8M15 48h8M73 48h8M24.7 24.7l5.7 5.7M65.6 65.6l5.7 5.7M24.7 71.3l5.7-5.7M65.6 30.4l5.7-5.7"/>';
  var MOON = '<path d="M62 62A26 26 0 0 1 36 22a26 26 0 1 0 38 40z" fill="#1E293B"/>';
  var ICONS = {
    sun: SUN,
    moon: MOON,
    pcloud: '<g transform="translate(-4 -6) scale(.7)">' + SUN + '</g><g transform="translate(14 14) scale(.8)">' + CLOUD + '</g>',
    pcloudn: '<g transform="translate(-2 -8) scale(.7)">' + MOON + '</g><g transform="translate(14 14) scale(.8)">' + CLOUD + '</g>',
    cloud: CLOUD,
    fog: '<path d="M20 36h56M14 50h60M22 64h56M30 78h40"/>',
    rain: CLOUD + '<path stroke="#22D3EE" d="M34 78l-4 10M50 78l-4 10M66 78l-4 10"/>',
    snow: CLOUD + '<path d="M34 80v.1M50 84v.1M66 80v.1M42 90v.1M58 90v.1" stroke-width="7"/>',
    storm: CLOUD + '<path stroke="#22D3EE" fill="#22D3EE" fill-opacity=".3" d="M52 66L42 82h10l-5 12 16-18H53z"/>'
  };
  function wmo(code, day) {
    if (code === 0) return day ? ["sun", TXT.sun] : ["moon", TXT.clear];
    if (code === 1) return day ? ["sun", TXT.mostlySun] : ["moon", TXT.mostlyClear];
    if (code === 2) return day ? ["pcloud", TXT.partly] : ["pcloudn", TXT.partly];
    if (code === 3) return ["cloud", TXT.overcast];
    if (code === 45 || code === 48) return ["fog", TXT.fog];
    if (code >= 51 && code <= 57) return ["rain", TXT.drizzle];
    if (code >= 61 && code <= 67) return ["rain", TXT.rain];
    if (code >= 71 && code <= 77) return ["snow", TXT.snow];
    if (code >= 80 && code <= 82) return ["rain", TXT.showers];
    if (code === 85 || code === 86) return ["snow", TXT.snowShowers];
    if (code >= 95) return ["storm", TXT.storm];
    return ["cloud", TXT.cloudy];
  }
  function renderWeather(w, stale) {
    var m = wmo(w.code, w.day);
    document.getElementById("wicon").innerHTML = "<svg " + S + ">" + ICONS[m[0]] + "</svg>";
    document.getElementById("temp").textContent = Math.round(w.temp) + ((W.unit === "fahrenheit") ? "°F" : "°C");
    document.getElementById("wtext").textContent = (W.label ? W.label + ", " : "") + m[1].toLowerCase();
    var mm = TXT.today + " " + Math.round(w.min) + "° / " + Math.round(w.max) + "°";
    if (stale) { var d = new Date(w.ts); mm += "  ·  " + TXT.asOf + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()); }
    document.getElementById("wmm").textContent = mm;
  }
  function loadWeather() {
    fetch(URL_W).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
      var w = { temp: j.current.temperature_2m, code: j.current.weather_code, day: j.current.is_day === 1,
        min: j.daily.temperature_2m_min[0], max: j.daily.temperature_2m_max[0], ts: Date.now() };
      try { localStorage.setItem(KEY, JSON.stringify(w)); } catch (e) {}
      renderWeather(w, false);
    }).catch(function () {
      try { var w = JSON.parse(localStorage.getItem(KEY)); if (w) renderWeather(w, true); } catch (e) {}
    });
  }
  try { var c = JSON.parse(localStorage.getItem(KEY)); if (c) renderWeather(c, true); } catch (e) {}
  loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

  /* ---------- kafle ---------- */
  var row = document.getElementById("row");
  var gridin = document.getElementById("gridin");
  var apps = document.getElementById("apps");
  var iconCache = {};

  function iconOf(pkg) {
    if (pkg in iconCache) return iconCache[pkg];
    var s = "";
    try { s = A ? A.icon(pkg) : ""; } catch (e) {}
    return (iconCache[pkg] = s ? "data:image/png;base64," + s : "");
  }
  function mkTile(label, pkg) {
    var t = document.createElement("div");
    t.className = "tile"; t.tabIndex = 0; t.dataset.pkg = pkg;
    t.innerHTML = '<div class="ph">' + label.charAt(0).toUpperCase() + '</div><div class="name"></div>';
    t.lastChild.textContent = label;
    return t;
  }
  function fillIcon(t, pkg) {
    var src = iconOf(pkg);
    if (!src) return;
    var img = new Image(); img.alt = ""; img.src = src;
    t.replaceChild(img, t.firstChild);
  }
  function allTile() {
    var t = document.createElement("div");
    t.className = "tile all"; t.tabIndex = 0; t.dataset.all = "1";
    t.innerHTML = '<div class="glyph">' + new Array(10).join("<i></i>") + '</div><div class="name">' + TXT.all + '</div>';
    return t;
  }

  /* ---------- lights (Tuya Cloud through the Java bridge, optional: needs assets/tuya.json) ---------- */
  var lights = document.getElementById("lights"), tcfg = null, treq = {}, tseq = 0;
  var BULB = '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>';
  window.onTuya = function (id, json) { var cb = treq[id]; delete treq[id]; if (cb) { var r = null; try { r = JSON.parse(json); } catch (e) {} cb(r); } };
  function tuya(method, path, body, cb) {
    var id = "r" + (++tseq); treq[id] = cb;
    try { A.tuya(id, method, path, body ? JSON.stringify(body) : ""); } catch (e) { delete treq[id]; cb(null); }
  }
  function paintLight(t, on, err) {
    t.classList.toggle("on", !!on); t.classList.toggle("err", !!err);
    t.querySelector("span").textContent = err ? TXT.offline : (on ? TXT.on : TXT.off);
    t.dataset.on = on ? "1" : "";
  }
  function buildLights() {
    if (!A || !A.tuyaConfig) return;
    try { tcfg = JSON.parse(A.tuyaConfig()); } catch (e) { tcfg = null; }
    if (!tcfg || !tcfg.devices) return;
    lights.innerHTML = "";
    tcfg.devices.forEach(function (d) {
      var t = document.createElement("div");
      t.className = "tile light"; t.tabIndex = 0; t.dataset.light = d.id; t.dataset.code = d.code;
      t.innerHTML = '<div class="bulb">' + BULB + '</div><div class="lt"><b></b><span>…</span></div>';
      t.querySelector("b").textContent = d.name;
      lights.appendChild(t);
    });
    var all = document.createElement("div");
    all.className = "tile lightall"; all.tabIndex = 0; all.dataset.lightall = "1";
    all.innerHTML = "<span></span>"; lights.appendChild(all); paintAll();
    refreshLights();
  }
  function refreshLights() {
    Array.prototype.forEach.call(lights.querySelectorAll(".light"), function (t) {
      tuya("GET", "/v1.0/iot-03/devices/" + t.dataset.light + "/status", null, function (r) {
        if (!r || !r.success) { paintLight(t, false, true); return; }
        var on = false; r.result.forEach(function (x) { if (x.code === t.dataset.code) on = !!x.value; });
        paintLight(t, on, false); paintAll();
      });
    });
  }
  function anyOn() { return Array.prototype.some.call(lights.querySelectorAll(".light"), function (t) { return !!t.dataset.on; }); }
  function paintAll() { var b = lights.querySelector(".lightall"); if (b) b.firstChild.textContent = anyOn() ? TXT.allOff : TXT.allOn; }
  function toggleAll() {
    var want = !anyOn();
    var all = Array.prototype.slice.call(lights.querySelectorAll(".light"));
    // commands one by one with a gap, then verify and retry: some plugs drop commands
    all.forEach(function (t, i) { setTimeout(function () { sendLight(t, want); }, i * 900); });
    var tries = 0;
    (function verify() {
      setTimeout(function () {
        var left = all.length, bad = [];
        all.forEach(function (t) {
          tuya("GET", "/v1.0/iot-03/devices/" + t.dataset.light + "/status", null, function (r) {
            var on = null; if (r && r.success) r.result.forEach(function (x) { if (x.code === t.dataset.code) on = !!x.value; });
            if (on !== null && on !== want) bad.push(t);
            if (on !== null) paintLight(t, on, false);
            if (--left === 0) {
              paintAll();
              if (bad.length && ++tries <= 2) { bad.forEach(function (t2, k) { setTimeout(function () { sendLight(t2, want); }, k * 900); }); verify(); }
            }
          });
        });
      }, all.length * 900 + 4000);
    })();
  }
  function sendLight(t, want) {
    paintLight(t, want, false); paintAll();
    tuya("POST", "/v1.0/iot-03/devices/" + t.dataset.light + "/commands", { commands: [{ code: t.dataset.code, value: want }] }, function (r) {
      if (!r || !r.success) { paintLight(t, !want, true); paintAll(); }
    });
  }
  function toggleLight(t) { sendLight(t, !t.dataset.on); }

  var installed = null;
  function getApps() {
    if (installed) return installed;
    try { installed = JSON.parse(A.listApps()); } catch (e) { installed = []; }
    return installed;
  }

  function buildRow() {
    var set = {}; getApps().forEach(function (a) { set[a.package] = 1; });
    row.innerHTML = "";
    FAV.forEach(function (f) {
      if (A && !set[f[1]]) return; // skip apps that are not installed
      var t = mkTile(f[0], f[1]); row.appendChild(t); fillIcon(t, f[1]);
    });
    row.appendChild(allTile());
  }

  function buildGrid() {
    var list = getApps();
    gridin.innerHTML = "";
    document.getElementById("cnt").textContent = "(" + list.length + ")";
    var i = 0;
    list.forEach(function (a) { gridin.appendChild(mkTile(a.label, a.package)); });
    // ikony leniwie, po kawałku, żeby nie blokować UI
    var tiles = gridin.children;
    (function next() {
      var end = Math.min(i + 6, tiles.length);
      for (; i < end; i++) fillIcon(tiles[i], tiles[i].dataset.pkg);
      if (i < tiles.length) setTimeout(next, 16);
    })();
  }

  function openApps() {
    buildGrid(); apps.classList.add("on");
    document.getElementById("grid").scrollTop = 0;
    var f = gridin.firstElementChild; if (f) f.focus();
  }
  function closeApps() {
    apps.classList.remove("on");
    var all = row.querySelector(".all"); (all || row.firstElementChild).focus();
  }
  function activate(t) {
    if (!t) return;
    if (t.dataset.all) { openApps(); return; }
    if (t.dataset.light) { toggleLight(t); return; }
    if (t.dataset.lightall) { toggleAll(); return; }
    if (A && t.dataset.pkg) A.launch(t.dataset.pkg);
  }

  /* ---------- nawigacja pilotem (nawigacja przestrzenna) ---------- */
  function scopeTiles() {
    if (apps.classList.contains("on")) return Array.prototype.slice.call(gridin.children);
    return Array.prototype.slice.call(row.children).concat(Array.prototype.slice.call(lights.children));
  }
  var lastLight = null;
  function move(dir) {
    var cur = document.activeElement, list = scopeTiles();
    if (!cur || list.indexOf(cur) < 0) { if (list[0]) list[0].focus(); return; }
    // lights widget: DOWN from a tile goes to the "all on/off" button, UP goes back
    if (cur.dataset.light && dir === "D") { var ab = lights.querySelector(".lightall"); if (ab) { lastLight = cur; ab.focus(); return; } }
    if (cur.dataset.lightall) {
      if (dir === "U") { (lastLight || lights.querySelector(".light")).focus(); return; }
      if (dir === "L" || dir === "R") return;
    }
    var c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
    var best = null, bs = 1e12;
    list.forEach(function (t) {
      if (t === cur) return;
      var r = t.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      var dx = x - cx, dy = y - cy, main, cross;
      if (dir === "L") { main = -dx; cross = Math.abs(dy); }
      else if (dir === "R") { main = dx; cross = Math.abs(dy); }
      else if (dir === "U") { main = -dy; cross = Math.abs(dx); }
      else { main = dy; cross = Math.abs(dx); }
      if (main <= 4) return;
      var s = main + cross * 3;
      if (s < bs) { bs = s; best = t; }
    });
    if (best) {
      best.focus();
      if (apps.classList.contains("on")) {
        var g = document.getElementById("grid"), gr = g.getBoundingClientRect(), br = best.getBoundingClientRect();
        var k = br.height / 230; // bieżąca skala sceny
        if (br.top < gr.top + 10 * k) g.scrollTop -= (gr.top + 10 * k - br.top) / k + 20;
        else if (br.bottom > gr.bottom - 20 * k) g.scrollTop += (br.bottom - gr.bottom + 20 * k) / k + 40;
      }
    }
  }
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (k === 37) move("L"); else if (k === 39) move("R");
    else if (k === 38) move("U"); else if (k === 40) move("D");
    else if (k === 13 || k === 23) activate(document.activeElement);
    else if (k === 27 || k === 4) { onBack(); }
    else return;
    e.preventDefault();
  });

  /* ---------- wywoływane z Activity ---------- */
  window.onBack = function () { if (apps.classList.contains("on")) closeApps(); };
  window.goHome = function () {
    apps.classList.remove("on");
    if (row.firstElementChild) row.firstElementChild.focus();
    tick();
  };
  window.onShow = function () { tick(); loadWeather(); refreshLights(); };

  /* ---------- start ---------- */
  buildRow();
  buildLights();
  setInterval(refreshLights, 60000);
  if (row.firstElementChild) row.firstElementChild.focus();
})();
</script>
<script>
/* background: waving perspective dot grid with drifting accent patches (canvas 960x540, scaled) */
(function(){
  var c=document.getElementById('wave'),x=c.getContext('2d'),W=960,H=540;
  var cs=getComputedStyle(document.documentElement),ACC=cs.getPropertyValue('--acc-rgb').trim()||'34,211,238',CRM=cs.getPropertyValue('--cream-rgb').trim()||'248,250,252';
  if(window.CONFIG&&window.CONFIG.wallpaper){c.style.display='none';return;}   // own wallpaper replaces the animation
  var SP=[[0,1,.13,.09,7],[2,4,.09,.12,6],[4,2,.11,.07,8],[1,5,.07,.1,5],[3,0,.1,.08,6.5],[5,3,.06,.11,4.5]];
  var COLS=96,ROWS=34,t0=Date.now();
  function h(u,v,t){ // wysokość fali
    return Math.sin(u*2.1+t*.55)*.55+Math.sin(v*1.7-t*.4+u*.8)*.45+Math.sin((u+v)*1.1+t*.3)*.3;
  }
  function frame(){
    var t=(Date.now()-t0)/1000;
    x.clearRect(0,0,W,H);
    var CU=[],CR=[];for(var k0=0;k0<SP.length;k0++){CU[k0]=Math.sin(t*SP[k0][2]+SP[k0][0])*1.1;CR[k0]=ROWS*(.5+.4*Math.sin(t*SP[k0][3]+SP[k0][1]));}
    for(var r=ROWS-1;r>=0;r--){          // far to near
      var z=r/(ROWS-1);                  // 0 far, 1 near
      var depth=1/(1.05-z*.9);           // perspective
      var sc=1.0+z*.9;
      var baseY=H*.34+Math.pow(z,1.35)*H*.72;
      for(var q=0;q<COLS;q++){
        var u=(q/(COLS-1)-.5)*2;
        var hh=h(u*3,r*.35,t);
        var px=W/2+u*W*.56*sc;
        var py=baseY-hh*(8+z*46);
        if(px<-4||px>W+4||py>H+4) continue;
        var a=Math.min(1,z*1.6)*(.5+.5*(hh+1)/2.2);
        var rad=.6+z*2.1+Math.max(0,hh)*.5;
        var hs=Math.sin(q*12.9898+r*78.233)*43758.5453; hs-=Math.floor(hs);   // random 0..1 per dot
        var heat=0;                                                          // patches drift over the surface
        for(var k=0;k<SP.length;k++){
          var cu=CU[k], cr=CR[k];
          var dd=Math.hypot((u-cu)*9,(r-cr)*.9);
          heat=Math.max(heat,1-dd/SP[k][4]);
        }
        var hot=heat>.05 && hs<heat*1.05 && z>.05;
        if(hot){ rad*=.7+hs*1.3; a=Math.min(1,a+.4); }
        x.fillStyle=hot?'rgba('+ACC+','+Math.min(1,a+.3)+')':'rgba('+CRM+','+a.toFixed(2)+')';
        x.fillRect(px-rad,py-rad,rad*2,rad*2);
      }
    }
  }
  var last=0;
  (function loop(n){ if(n-last>40){ last=n; frame(); } requestAnimationFrame(loop); })(0);
})();
</script>
